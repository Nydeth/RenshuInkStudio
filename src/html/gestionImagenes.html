<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/img/OniPi.png" type="image/x-icon">
    <link rel="stylesheet" href="../cssComponents/gestiones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Gestión de imágenes de tatuajes</title>
</head>

<body>
    <header>
        <a href="/">
            <img src="../assets/img/OniPi.png" alt="logo" class="logoNav">
        </a>
    </header>
    <div class="logoutDiv">
        <span class="logoutText" alt="Cerrar sesión" onclick="logout()">Cerrar sesión</span>
        <span class="fa fa-arrow-right-from-bracket logout" onclick="logout()"></span>
    </div>
    <div class="container">
        <h1>Gestión de las imágenes para los tatuadores</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="Título" required><br><br>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="Descripción" required></textarea><br><br>

            <label for="tatuadorId">ID Tatuador:</label>
            <input type="text" id="tatuadorId" name="TatuadorId" required><br><br>

            <label for="fotografia">Fotografía:</label>
            <input type="file" id="fotografia" name="Fotografía" accept="image/*" required><br><br>

            <button type="button" class="upload-button" onclick="submitForm()">Subir Imagen</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Título</th>
                    <th>Descripción</th>
                    <th>ID Tatuador</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="imagenesContainer"></tbody>
        </table>

        <button type="button" class="back-button" href="menuOpciones.html"><a href="menuOpciones.html">Volver al
                menú</a></button>
    </div>
    <div>
        <script>
            function getToken() {
                return sessionStorage.getItem('token');
            }
            function submitForm() {
                const form = document.getElementById('uploadForm');
                const formData = new FormData(form);

                fetch('http://localhost:5145/api/ImagenesTattoo', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error: ${response.status} ${response.statusText}`);
                        }
                        return response.text().then(text => {
                            try {
                                return JSON.parse(text);
                            } catch {
                                return text;
                            }
                        });
                    })
                    .then(data => {
                        if (typeof data === 'string') {
                            console.log('Response is a string:', data);
                            alert(data); // Mostrar el texto plano como alerta
                        } else {
                            console.log('Success:', data);
                            alert(data.message || 'Imagen subida con éxito'); // Mostrar el mensaje del objeto JSON
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Hubo un error al subir la imagen: ' + error.message);
                    });
            }
            async function obtenerImagenes() {
                const response = await fetch(`http://localhost:5145/api/ImagenesTattoo`);
                const data = await response.json();
                const imagenesContainer = document.getElementById('imagenesContainer');

                data.forEach(imagen => {
                    const tr = document.createElement('tr');

                    const imgTd = document.createElement('td');
                    const img = document.createElement('img');
                    const titleTd = document.createElement('td');
                    const descriptionTd = document.createElement('td');
                    const tatuadorIdTd = document.createElement('td');
                    const actionTd = document.createElement('td');
                    const deleteButton = document.createElement('button');

                    img.src = `data:image/jpeg;base64,${imagen.fotografia}`;
                    img.alt = imagen.titulo;
                    titleTd.textContent = imagen.titulo;
                    descriptionTd.textContent = imagen.descripcion;
                    tatuadorIdTd.textContent = imagen.tatuadorId;
                    deleteButton.textContent = 'Eliminar';
                    deleteButton.classList.add('deleteButton');
                    deleteButton.onclick = () => eliminarImagen(imagen.id, tr);

                    imgTd.appendChild(img);
                    actionTd.appendChild(deleteButton);

                    tr.appendChild(imgTd);
                    tr.appendChild(titleTd);
                    tr.appendChild(descriptionTd);
                    tr.appendChild(tatuadorIdTd);
                    tr.appendChild(actionTd);

                    imagenesContainer.appendChild(tr);
                });
            }

            async function eliminarImagen(id, imgDiv) {
                const response = await fetch(`http://localhost:5145/api/ImagenesTattoo/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (response.ok) {
                    imgDiv.remove();
                    alert('Imagen eliminada con éxito');
                } else {
                    alert('Hubo un error al eliminar la imagen');
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                const logoutDiv = document.querySelector('.logoutDiv');
                let isHidden = false;

                function handleScroll() {
                    const currentScrollPos = window.pageYOffset;
                    const shouldBeHidden = currentScrollPos > 15;

                    if (shouldBeHidden !== isHidden) {
                        isHidden = shouldBeHidden;
                        logoutDiv.style.display = isHidden ? 'none' : 'block';
                    }
                }

                window.addEventListener("scroll", handleScroll);
            });

            obtenerImagenes();
        </script>
    </div>
</body>

</html>
