<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/img/OniPi.png" type="image/x-icon">
    <link rel="stylesheet" href="../cssComponents/gestiones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Gestión de Publicidad</title>
</head>

<body>
    <header>
        <a href="/">
            <img src="../assets/img/OniPi.png" alt="logo" class="logoNav">
        </a>
    </header>
    <div class="logoutDiv">
        <button class="logoutText" alt="Cerrar sesión" onclick="logout()">Cerrar sesión</butt>
        <span class="fa fa-arrow-right-from-bracket logout" onclick="logout()"></span>
    </div>
    <div class="container">
        <h1>Gestión de Publicidad</h1>
        <div>
            <form id="uploadForm" enctype="multipart/form-data">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="Titulo" required><br><br>

                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="Descripcion" required></textarea><br><br>

                <label for="fechaInicio">Fecha de Inicio:</label>
                <input type="date" id="fechaInicio" name="FechaInicio" required><br><br>

                <label for="fechaFin">Fecha de Fin:</label>
                <input type="date" id="fechaFin" name="FechaFin" required><br><br>

                <label for="imagen">Imagen:</label>
                <input type="file" id="imagen" name="Imagen" accept="image/*"><br><br>

                <button type="button" onclick="submitForm()">Subir Publicidad</button>
            </form>
        </div>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Fechas</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="publicidadContainer"></tbody>
            </table>
        </div>
        <button type="button" class="back-button" href="menuOpciones.html"><a href="menuOpciones.html">Volver al
                menú</a></button>
    </div>
    <script>
        function getToken() {
            return sessionStorage.getItem('token');
        }

        function submitForm() {
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);

            fetch('http://localhost:5145/api/publicidad', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                },
                body: formData
            })
                .then(async response => {
                    const contentType = response.headers.get('Content-Type');
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Error: ${response.status} ${response.statusText} - ${errorText}`);
                    }
                    if (contentType && contentType.includes('application/json')) {
                        return response.json();
                    } else {
                        return response.text();
                    }
                })
                .then(data => {
                    if (typeof data === 'string') {
                        console.log('Response is a string:', data);
                        alert(data); // Mostrar el texto plano como alerta
                    } else {
                        console.log('Success:', data);
                        alert(data.message || 'Publicidad subida con éxito'); // Mostrar el mensaje del objeto JSON
                    }
                    obtenerPublicidad(); // Refresh the list after a successful upload
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Hubo un error al subir la publicidad: ' + error.message);
                });
        }

        async function obtenerPublicidad() {
            const response = await fetch('http://localhost:5145/api/publicidad', {
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                }
            });
            const data = await response.json();
            const publicidadContainer = document.getElementById('publicidadContainer');

            publicidadContainer.innerHTML = ''; // Clear the container before adding new items

            data.forEach(item => {
                const tr = document.createElement('tr');
                const imgTd = document.createElement('td');
                const img = document.createElement('img');
                const titleTd = document.createElement('td');
                const descriptionTd = document.createElement('td');
                const dateTd = document.createElement('td');
                const actionTd = document.createElement('td');
                const deleteButton = document.createElement('button');

                if (item.imagen) {
                    img.src = `data:image/jpeg;base64,${item.imagen}`;
                    img.alt = item.titulo;
                } else {
                    img.alt = 'Sin imagen';
                }
                titleTd.textContent = item.titulo;
                descriptionTd.textContent = item.descripcion;
                dateTd.textContent = `Inicio: ${new Date(item.fechaInicio).toLocaleDateString()} - Fin: ${new Date(item.fechaFin).toLocaleDateString()}`;
                deleteButton.textContent = 'Eliminar';
                deleteButton.classList.add('deleteButton');
                deleteButton.onclick = () => eliminarPublicidad(item.id, tr);

                imgTd.appendChild(img);
                actionTd.appendChild(deleteButton);

                tr.appendChild(imgTd);
                tr.appendChild(titleTd);
                tr.appendChild(descriptionTd);
                tr.appendChild(dateTd);
                tr.appendChild(actionTd);

                publicidadContainer.appendChild(tr);
            });
        }

        async function eliminarPublicidad(id, tr) {
            const response = await fetch(`http://localhost:5145/api/publicidad/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                }
            });

            if (response.ok) {
                tr.remove();
                alert('Publicidad eliminada con éxito');
            } else {
                const errorText = await response.text();
                alert('Hubo un error al eliminar la publicidad: ' + errorText);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const logoutDiv = document.querySelector('.logoutDiv');
            let isHidden = false;

            function handleScroll() {
                const currentScrollPos = window.pageYOffset;
                const shouldBeHidden = currentScrollPos > 15;

                if (shouldBeHidden !== isHidden) {
                    isHidden = shouldBeHidden;
                    logoutDiv.style.display = isHidden ? 'none' : 'block';
                }
            }

            window.addEventListener("scroll", handleScroll);
        });

        document.addEventListener('DOMContentLoaded', obtenerPublicidad);
    </script>
</body>

</html>
